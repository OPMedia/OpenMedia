services:
  postgres:
    image: postgres:16-alpine
    container_name: openmedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: openmedia
    command: >
      postgres
      -c max_connections=250
      -c shared_buffers=256MB
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    ports:
      - "15432:5432"
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/schema-deploy.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openmedia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
