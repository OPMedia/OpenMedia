<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 200" width="472" height="200" role="img" aria-label="Serata">
  <title>Serata — horizontal lockup, for light surfaces</title>
  <desc>Transparent background, dark wordmark. The wordmark is live text pinned with textLength so the layout cannot overflow.</desc>
  <defs>
    <linearGradient id="markDuskLockup" gradientUnits="userSpaceOnUse" x1="158" y1="146" x2="158" y2="366">
      <stop offset="0" stop-color="#332A63"/>
      <stop offset=".5" stop-color="#7A4A87"/>
      <stop offset="1" stop-color="#E0705A"/>
    </linearGradient>
  </defs>
  <g transform="translate(-49.66 -8.58) scale(.424)">
    <path fill="url(#markDuskLockup)" stroke="url(#markDuskLockup)" stroke-width="44" stroke-linejoin="round"
          d="M158 146 L378 256 L158 366 Q208 256 158 146 Z"/>
  </g>
  <text x="140" y="139" fill="#171A2E" font-size="112" font-weight="600" letter-spacing="-1.5"
        textLength="318" lengthAdjust="spacing"
        font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">Serata</text>
</svg>
