<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Serata">
  <title>Serata — app icon (dark, opaque)</title>
  <desc>Full-bleed version, no transparency. Also safe as a maskable PWA / Android adaptive icon: the mark stays inside the central 80% safe zone.</desc>
  <defs>
    <linearGradient id="duskDarkSq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1F3B"/>
      <stop offset=".55" stop-color="#46356F"/>
      <stop offset="1" stop-color="#E0705A"/>
    </linearGradient>
    <linearGradient id="markCreamSq" gradientUnits="userSpaceOnUse" x1="158" y1="146" x2="158" y2="366">
      <stop offset="0" stop-color="#FFFBF6"/>
      <stop offset="1" stop-color="#FFE7D5"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#duskDarkSq)"/>
  <g transform="translate(-24 0) scale(2)">
    <path fill="url(#markCreamSq)" stroke="url(#markCreamSq)" stroke-width="44" stroke-linejoin="round"
          d="M158 146 L378 256 L158 366 Q208 256 158 146 Z"/>
  </g>
</svg>
