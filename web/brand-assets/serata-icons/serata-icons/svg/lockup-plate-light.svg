<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="Serata">
  <title>Serata — horizontal lockup on a light plate</title>
  <desc>Opaque ivory plate with rounded corners.</desc>
  <defs>
    <linearGradient id="plateLightLockup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2EBE2"/>
    </linearGradient>
    <linearGradient id="markDuskPlate" gradientUnits="userSpaceOnUse" x1="158" y1="146" x2="158" y2="366">
      <stop offset="0" stop-color="#332A63"/>
      <stop offset=".5" stop-color="#7A4A87"/>
      <stop offset="1" stop-color="#E0705A"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="598" height="238" rx="51" fill="url(#plateLightLockup)" stroke="#00000014" stroke-width="2"/>
  <g transform="translate(64 20)">
